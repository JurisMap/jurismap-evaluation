# Judging (tasks 4 to 6): two calls per draft and judge, blind to the condition (src/jm_eval/drafting/judging.py).
#   rubric: the plan's five criteria (1-5) from the draft, the case document and the headnotes of the
#     supplied precedents, plus the facts about the case that the draft adds to the case document
#     (minus those the fact guard replaced or flagged: the invented facts the guard missed).
#   arguments: for each real appellant argument, raised / partly / absent (recall; for granted appeals,
#     whether the accepted argument was raised). Combined with the local NLI model (a sentence of the
#     draft entails the argument above the threshold): an argument counts as raised when at least two
#     of GPT-5.4, Mistral and the NLI model say so ("partly" counts as not raised; it is reported apart).
# A draft is 6,000 to 9,000 tokens, so the prompts exceed the plan's 8,000: the limit is 16,000, as for
# Phase 7's long inputs (to confirm with the author). Mistral is paced at 3 calls a minute (31,500 tokens a
# minute). Prompts and answer checks were tried on the smoke-test drafts of the fictitious notice only
# (ground rule 8), with an argument list written for it as development material.
judging:
  judges: [judge_a, judge_b]          # GPT-5.4 (reported) and Mistral Medium 3; alpha between them
  separate: [judge_gemini]            # same family as the system: rubric only, reported separately
  max_prompt_tokens: 16000            # confirmed by the author, 2026-10-18 (as in Phase 7)
  rpm: {judge_a: 30, judge_b: 3, judge_gemini: 12}   # calls take 1-2 min (reasoning)
  threads: {judge_a: 4, judge_b: 1, judge_gemini: 6}  # judge_a: 10 threads exceeded the Azure deployment's token rate (429, 2026-10-21)

  nli_threshold: 0.5
  development:
    smoke_run: data/v2/smoke_20261010T105410Z
    notice: Ficticious_Infraction_Notice_Drone_Association.docx
    arguments:                        # written for the fictitious notice to try the prompt; not evaluated material
      - "A recorrente alega que é associação civil sem fins lucrativos de ajuda mútua entre associados, e não seguradora, de modo que a proteção mutual não constitui contrato de seguro."
      - "A recorrente invoca a liberdade constitucional de associação (art. 5º, XVII e XVIII, da Constituição Federal)."
      - "A recorrente alega ausência de dolo ou má-fé e a boa-fé de seus dirigentes."
      - "A recorrente sustenta que a multa é desproporcional e pede sua redução ou a conversão em advertência."
      - "A recorrente alega nulidade do auto de infração por cerceamento de defesa."

# Analysis (the author, 2026-10-18). The draft that cites its own source decision (found by the web search) is
# counted as a failure mode and left out of argument recall and the rubric; a sensitivity check keeps it.
# A lost draft is the worst outcome in the main Friedman analysis (rubric scores 1, recall 0, the user
# receives nothing); a sensitivity analysis drops the incomplete blocks (notice x run with a lost draft).
analysis:
  leaked: [[N11, no_template, 2]]
  lost_as_worst: true

# Improvement round (the author, 2026-10-18): the fact controls of backend branch feature/fact_premises_guard
# (premise_rule, case_facts, premise_check) tried alone and together against v2.6's behaviour on
# development notices only (ground rule 8), in full mode, one run each; the arm is chosen by the rule
# below, fixed before any development draft is scored; then a new freeze (v2.7) and Phase 8 again.
improvement:
  dev_notices:
    n: 6                      # six distinct cells of the test notices' legal-basis key x outcome grid, at random (an empty cell is skipped)
    seed: 20261019
    # Excluded besides the Phases 6-7 decisions and outvoted rapporteurs: the 15 test notices and their processes.
  arms:
    baseline: []
    premise_rule: [premise_rule]
    case_facts: [case_facts]
    premise_check: [premise_check]
    all: [premise_rule, case_facts, premise_check]
  mode: full
  runs: 1
  # Selection rule (fixed before scoring). Primary: the fewest estimated invented case facts per draft
  # (GPT-5.4's added facts, classified by scripts/89's prompt, times the audited share per kind:
  # invented 0.538, in_notice 0.083, assertion 0, procedural 0). An arm is eligible only if, against
  # the baseline, its mean argument recall (majority of GPT-5.4, Mistral, NLI) drops by at most 0.10,
  # its GPT-5.4 use of precedents and legal accuracy drop by at most 0.5 each, and its drafts carry at
  # most 8 [VERIFICAR: ...] markers on average. Among eligible arms within 0.5 invented facts per draft
  # of the best, the one with fewer controls (then lower cost) is chosen. Also reported, not decisive:
  # the share of drafts asserting the past-offences claim as a fact.
