# ------------------------------------------------------------------------------------------------ A2
- id: a2
  title: A2 — the map reproduces the embedding space, with known limits
  claim: >-
    Version 2's map keeps the infraction category of a decision's neighbours almost as well as the embedding space and
    better than version 1's map; it is an aid next to semantic similarity, not a substitute for it (DECISIONS 2026-10-10).
  caveats:
    - About 4.5 of a decision's 10 nearest map neighbours are among its 10 most similar decisions; t-SNE keeps nearest neighbours better, but a new case cannot be placed on it (UMAP stays).
    - The UMAP setting was selected on these unsupervised metrics over a grid of 30 candidates (Phase 5.1a).
    - The map is exactly reproducible only with the pinned library versions and row order; a refit with another seed rearranges the layout.
  numbers:
    - {id: a2.samecat.map, text: "Same category among the 10 nearest map neighbours, served map (2,390)", source: a2_metrics, where: {set: v2_full, projection: frozen_v2, metric: same_label@10/R-cat}, value: mean, fmt: "{0:%1}"}
    - {id: a2.samecat.space, text: "... among the 10 nearest decisions in the embedding space", source: a2_metrics, where: {set: v2_full, projection: original, metric: same_label@10/R-cat}, value: mean, fmt: "{0:%1}"}
    - {id: a2.samecat.chance, text: "... by chance", source: a2_metrics, where: {set: v2_full, projection: original, metric: same_label_chance@10/R-cat}, value: mean, fmt: "{0:%1}"}
    - {id: a2.trust10, text: "Trustworthiness at k = 10, served map (2,390)", source: a2_metrics, where: {set: v2_full, projection: frozen_v2, metric: trustworthiness@10}, value: mean, fmt: "{0:.3f}"}
    - {id: a2.cont10, text: "Continuity at k = 10, served map (2,390)", source: a2_metrics, where: {set: v2_full, projection: frozen_v2, metric: continuity@10}, value: mean, fmt: "{0:.3f}"}
    - {id: a2.jaccard, text: "kNN Jaccard at 10 (map neighbours vs most similar decisions), served map", source: a2_metrics, where: {set: v2_full, projection: frozen_v2, metric: knn_jaccard@10}, value: mean, fmt: "{0:.3f}"}
    - {id: a2.tsne.trust10, text: "t-SNE on the same vectors: trustworthiness at 10 / kNN Jaccard", source: a2_metrics, where: {set: v2_full, projection: tsne_p30, metric: trustworthiness@10}, value: mean, fmt: "{0:.3f}"}
    - {id: a2.tsne.jaccard, text: "t-SNE: kNN Jaccard at 10", source: a2_metrics, where: {set: v2_full, projection: tsne_p30, metric: knn_jaccard@10}, value: mean, fmt: "{0:.3f}"}
    - {id: a2.v1.trust10, text: "Version 1's map on the comparison set: trustworthiness at 10 (mean of five seeds)", source: a2_metrics, where: {set: v1_comparison, projection: umap_n15_d0.1, metric: trustworthiness@10}, value: mean, fmt: "{0:.3f}"}
    - {id: a2.v2cs.trust10, text: "Version 2's served map on the comparison set: trustworthiness at 10", source: a2_metrics, where: {set: v2_comparison, projection: frozen_v2, metric: trustworthiness@10}, value: mean, fmt: "{0:.3f}"}
