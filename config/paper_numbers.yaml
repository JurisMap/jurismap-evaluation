# ------------------------------------------------------------------------------------------------ A5
- id: a5
  title: A5 — a larger context does not make the chat better
  claim: >-
    More than 10 decisions in the context makes the chat slower and dearer and gives more unsupported statements per answer,
    with nothing gained on known answers; summarising the cases does not change that. A5 does not argue 10 against 5.
  caveats:
    - 11 or 12 open questions per setting, one answer each; only the trends in cost, latency and unsupported claims per answer are clear. The supported share at 30 is within noise of 10.
    - Completeness is not reported for A5 (DECISIONS 2026-10-18).
  numbers:
