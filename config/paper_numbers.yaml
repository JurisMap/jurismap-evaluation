# ------------------------------------------------------------------------------------------------ A6
- id: a6
  title: A6 — latency and cost of version 2 as deployed
  claim: >-
    As deployed, JurisMap answers interactively except for the defense draft, which takes about two minutes; a draft costs
    about four chat answers. The fact controls cost about 17 s per draft; dropping the legal search saves about 28 s.
  caveats:
    - A local server calling the cloud APIs, one request at a time, on one evening; not production Cloud Run, not concurrent users.
    - Google Search grounding queries (full mode only) are not in the costs.
  numbers:
    - {id: a6.map, text: "Map view, latency p50 / p95 (s)", source: a6_latency, where: {unit: map_view}, value: [latency_p50_s, latency_p95_s], fmt: "{0:.1f} / {1:.1f}"}
    - {id: a6.upload, text: "Case upload, latency p50 / p95 (s); cost", source: a6_latency, where: {unit: case_upload}, value: [latency_p50_s, latency_p95_s, usd_mean], fmt: "{0:.1f} / {1:.1f}; {2:usd}"}
    - {id: a6.chat, text: "Chat, latency p50 / p95 (s); cost", source: a6_latency, where: {unit: chat}, value: [latency_p50_s, latency_p95_s, usd_mean], fmt: "{0:.1f} / {1:.1f}; {2:usd}"}
    - {id: a6.defense, text: "Defense draft as deployed, latency p50 (95% CI) / p95 (s); cost", source: a6_latency, where: {unit: v2.7_deployed}, value: [latency_p50_s, latency_p50_ci_low_s, latency_p50_ci_high_s, latency_p95_s, usd_mean], fmt: "{0:.1f} ({1:.1f} to {2:.1f}) / {3:.1f}; {4:usd}"}
    - {id: a6.defense.ok, text: "Defense drafts written as deployed", source: a6_latency, where: {unit: v2.7_deployed}, value: [ok, calls], fmt: "{0:d} of {1:d}"}
