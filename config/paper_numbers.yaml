# ------------------------------------------------------------------------------------------------ A4
- id: a4
  title: A4 — fact controls cut invented case facts in the drafts
  claim: >-
    Version 2 before the fact controls (v2.6) asserted about three to four case facts per draft that the notice does not
    state, many carried over from the precedents; the controls of v2.7 cut them by about 90% with fidelity up and legal
    accuracy held. The cost is argument recall.
  caveats:
    - Absolute draft quality is not claimed: the judges agree on the order of drafts, not on levels, and no human rated the drafts.
    - The invented-fact estimate rests on the author's blind audits of 50 passages per version; its range uses the Wilson bounds.
    - 15 notices; differences that are not significant are inconclusive. Lost drafts (recitation blocks) are counted apart.
  numbers:
    - {id: a4.inv.v26, text: "Invented case facts per draft, v2.6 (mean over notices)", source: a4_versions, where: {metric: estimated_invented}, value: mean_a, fmt: "{0:.1f}"}
