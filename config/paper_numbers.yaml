# ------------------------------------------------------------------------------------------------ A3
- id: a3
  title: A3 — the chat answers from the supplied cases, with unsupported statements reduced
  claim: >-
    A grounding-and-quoting strategy, selected by a rule fixed in advance, cut unsupported statements of the chat from about
    a quarter to under one in twenty on the development sets. On the evaluated set, GPT-5.4 (the judge that agrees best with
    The author) finds 89% of the claims supported; code-scored answers are all correct and no answer cites a decision it was
    not given.
  caveats:
    - Unsupported statements are reduced, not removed (about 4.5 per open answer by GPT-5.4).
    - '"Contradicted" is the judges'' label, not a measured share of false statements: The author''s audit did not confirm it at claim level.'
    - Mistral's levels are an upper bound (lenient on the planted controls and the audit); Gemini is the same family as the system and is reported separately.
    - The coverage of the reference points costs about 0.10 against the previous strategy.
  numbers:
    - {id: a3.dev.baseline, text: "Development sets: unsupported rate of the baseline (version 2 before Phase 6.1)", source: a3_strategies, where: {candidate: baseline}, value: unsupported_rate, fmt: "{0:.3f}"}
    - {id: a3.dev.selected, text: "Development sets: unsupported rate of the selected strategy (quoted_full)", source: a3_strategies, where: {candidate: quoted_full}, value: unsupported_rate, fmt: "{0:.3f}"}
    - {id: a3.dev.diff, text: "Selected − baseline, unsupported rate (95% CI over questions)", source: a3_selection, key: [difference_from_baseline.difference, difference_from_baseline.ci_low, difference_from_baseline.ci_high], fmt: "{0:+.3f} ({1:.3f} to {2:.3f})"}
    - {id: a3.dev.coverage, text: "Development sets: coverage of the selected strategy (limit: the baseline's less 0.10)", source: a3_strategies, where: {candidate: quoted_full}, value: coverage, fmt: "{0:.3f}"}
    - {id: a3.templated, text: "Templated questions correct (Wilson 95%)", source: a3_chatbot, where: {section: templated, group: all, metric: accuracy, rater: code}, value: [note, ci_low, ci_high], fmt: "{0} ({1:.2f} to {2:.2f})"}
    - {id: a3.abstain, text: "Unanswerable questions declined", source: a3_chatbot, where: {section: unanswerable, group: all, metric: abstention_rate, rater: code}, value: note, fmt: "{0}"}
