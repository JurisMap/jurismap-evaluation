# Phase 11: every number the paper may quote, read from its source file by scripts/98_results_and_quotes.py,
# which writes results/RESULTS.md. A number is never typed here: each entry names a source of
# config/paper_assets.yaml `sources` and a selector, and the script reads the value.
#
# Selectors
#   CSV / Excel   where: {column: value, ...} must match exactly one row (a null value matches an empty cell),
#                 unless agg (sum, mean, count) is given; value: the column, or a list of columns.
#   JSON          key: a dotted path (list items by index), or a list of paths.
#   computed      expr: arithmetic over other numbers' raw values, v['<id>'] (used only where no file holds the figure).
# fmt: a template over the selected values ({0}, {1}, ... in value/key order, or {name} for a column). Specs:
#   .3f, +.3f, ,.0f, d   rounded half up on the value as written
#   %1 / %0              percentage with 1 / 0 decimals
#   p                    p-value ("< 0.001" below 0.001)
#   usd / usd2           dollars with 3 / 2 decimals
version: 1

sections:

# ------------------------------------------------------------------------------------------------ versions
- id: versions
  title: The two versions and the corpus
  claim: >-
    Version 1 is the system the experts evaluated in 2025; version 2 is the upgraded system evaluated technically. The
    paper labels them "v1" and "v2" only (ground rule 9).
  caveats:
    - Data corrections (report and vote re-extraction, prompt rendering) are applied to both and are not version differences.
  numbers:
    - {id: corpus.v1, text: "Version 1 corpus", source: reproducibility, where: {section: Corpus, setting: Decisions}, value: v1, fmt: "{0}"}
    - {id: corpus.v2, text: "Version 2 corpus", source: reproducibility, where: {section: Corpus, setting: Decisions}, value: v2, fmt: "{0}"}
    - {id: corpus.v1.sessions, text: "Version 1 sessions and period", source: reproducibility, where: {section: Corpus, setting: Sessions and period}, value: v1, fmt: "{0}"}
    - {id: corpus.v2.sessions, text: "Version 2 sessions and period", source: reproducibility, where: {section: Corpus, setting: Sessions and period}, value: v2, fmt: "{0}"}
    - {id: corpus.shared, text: "Decisions in both versions (comparison set), matched by URL and process number", source: v1_v2_match, key: matched, fmt: "{0:,.0f}"}

# ------------------------------------------------------------------------------------------------ B2
- id: b2
  title: B2 — the experts' ratings of version 1
  claim: >-
    Five legal experts rated version 1 above the neutral point on every construct (1–5 scale).
  caveats:
    - N = 5; the smallest attainable one-sided exact p is 0.031 (all five above neutral). Scenario relevance does not reach it.
    - The workbook rerun here is identical to the cloud workbook in the paper folder (486 cells; `results/b2_reproduction_check.json`).
  numbers:
    - {id: b2.overall, text: "Overall score (15 items), mean and bootstrap 95% CI", source: b2_workbook, sheet: Constructs, where: {Construct: Overall (15 items)}, value: [Mean, Boot_CI95_low, Boot_CI95_high], fmt: "{0:.2f} ({1:.2f} to {2:.2f})"}
    - {id: b2.value, text: "Value proposition, mean (CI), Wilcoxon p", source: b2_workbook, sheet: Constructs, where: {Construct: Value proposition}, value: [Mean, Boot_CI95_low, Boot_CI95_high, Wilcoxon_exact_p_one_sided], fmt: "{0:.2f} ({1:.2f} to {2:.2f}), p = {3:.3f}"}
    - {id: b2.core, text: "Core functionality, mean (CI), Wilcoxon p", source: b2_workbook, sheet: Constructs, where: {Construct: Core functionality}, value: [Mean, Boot_CI95_low, Boot_CI95_high, Wilcoxon_exact_p_one_sided], fmt: "{0:.2f} ({1:.2f} to {2:.2f}), p = {3:.3f}"}
    - {id: b2.interface, text: "Interface quality, mean (CI), Wilcoxon p", source: b2_workbook, sheet: Constructs, where: {Construct: Interface quality}, value: [Mean, Boot_CI95_low, Boot_CI95_high, Wilcoxon_exact_p_one_sided], fmt: "{0:.2f} ({1:.2f} to {2:.2f}), p = {3:.3f}"}
    - {id: b2.scenario, text: "Scenario relevance, mean (CI), Wilcoxon p", source: b2_workbook, sheet: Constructs, where: {Construct: Scenario relevance}, value: [Mean, Boot_CI95_low, Boot_CI95_high, Wilcoxon_exact_p_one_sided], fmt: "{0:.2f} ({1:.2f} to {2:.2f}), p = {3:.3f}"}
    - {id: b2.reproduced, text: "Cells of the B2 workbook compared with the cloud version / identical", source: b2_check, key: [cells_compared, identical], fmt: "{0} / {1}"}

