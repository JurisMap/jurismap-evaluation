# ------------------------------------------------------------------------------------------------ C3
- id: release
  title: C3 — the evaluation is reproducible from the release
  claim: >-
    Every table and figure of A1–A6 is rebuilt from the released data, and this was checked in a fresh copy with the
    network blocked; the reference pipeline reproduces version 2's retrieval vectors and map with public libraries.
  caveats:
    - The system's own outputs, the judges' calls (outside 114 cache entries) and the private material (SUSEP, questionnaire) are not reproducible from the release; they are released as outputs or aggregates.
  numbers:
    - {id: rel.data, text: "Data files matching their hashes", source: release_verify, key: verify_data.output, fmt: "{0}"}
    - {id: rel.tests, text: "Tests in the fresh copy", source: release_verify, key: pytest.summary, fmt: "{0}"}
    - {id: rel.reruns, text: "Analysis runs reproduced exactly / differing for a known reason", source: release_verify, key: ["rerun_counts.reproduced", "rerun_counts.differs (known reason)"], fmt: "{0} / {1}"}
    - {id: rel.fusion, text: "Reference pipeline: largest difference between stored and recomputed fused vectors", source: release_reference, key: offline.fusion.max_abs_difference, fmt: "{0:.0e}"}
    - {id: rel.embedding, text: "Reference pipeline: decisions re-embedded through Vertex AI, minimum cosine to the stored vector", source: release_reference, key: online.embedding.min_cosine_fused, fmt: "{0:.1f}"}

# Results that exist but carry no claim of the paper (the author's rule: leave them out rather than report them weakly).
not_claimed:
  - "A1 on the SUSEP gold standard (results/a1_retrieval_susep.csv): local open models only (ground rule 1), 50 cases, overlapping intervals; it does not compare the two versions."
  - "A3 and the SUSEP experts' similarity ratings: dropped from the paper (DECISIONS 2026-10-11); internal, not in results/."
  - "A5 completeness (coverage of reference points): not reported (DECISIONS 2026-10-18)."
  - "The answer-level hallucination rate of the plan (A3, A5): near 1 at every setting; unsupported claims per answer is reported instead."
  - "v2.5 against v2.6 on the evaluated set (PHASE_6_1C_SUMMARY.md): descriptive only; the strategy was chosen on the development sets."
  - "Latency of v2.6 against v2.7 in Phase 8: not comparable (different run conditions); A6's interleaved comparison replaces it."
