    - {id: a2.v2cs.samecat, text: "Version 2's served map on the comparison set: same category among 10 nearest", source: a2_metrics, where: {set: v2_comparison, projection: frozen_v2, metric: same_label@10/R-cat}, value: mean, fmt: "{0:%1}"}
