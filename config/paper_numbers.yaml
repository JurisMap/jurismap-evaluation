# ------------------------------------------------------------------------------------------------ A1 labels
- id: a1_labels
  title: A1 — the silver labels are reliable
  claim: >-
    The relevance labels read from the decisions are correct in nearly every audited case, by the author's audit and by a
    second model's review.
  caveats:
    - The audited legal-basis accuracy refers to the labels before two parser corrections that the audit itself prompted.
    - The category labeller (Gemini) is of the system's family; a blind second labelling by Mistral gives the same benchmark results.
  numbers:
    - {id: a1.audit.base, text: "Author's audit, legal basis: correct of judged (Wilson 95%)", source: a1_label_audit, key: [legal_basis.correct, legal_basis.judged, legal_basis.wilson_95.0, legal_basis.wilson_95.1], fmt: "{0} of {1} ({2:%1} to {3:%1})"}
    - {id: a1.audit.penalty, text: "Author's audit, penalty type", source: a1_label_audit, key: [penalty_type.correct, penalty_type.judged], fmt: "{0} of {1}"}
    - {id: a1.audit.infringed, text: "Author's audit, infringed provision", source: a1_label_audit, key: [infringed_provision.correct, infringed_provision.judged], fmt: "{0} of {1}"}
    - {id: a1.audit.category, text: "Author's audit, infraction category", source: a1_label_audit, key: [infraction_category.correct, infraction_category.judged], fmt: "{0} of {1}"}
    - {id: a1.review.base, text: "GPT-5.4 review, legal basis correct (Wilson 95%)", source: a1_label_review, key: [legal_basis.correct, legal_basis.n, legal_basis.wilson_95.0, legal_basis.wilson_95.1], fmt: "{0} of {1} ({2:%1} to {3:%1})"}
    - {id: a1.review.penalty, text: "GPT-5.4 review, penalty type identical", source: a1_label_review, key: [penalty_type.correct, penalty_type.n], fmt: "{0} of {1}"}
    - {id: a1.review.infringed, text: "GPT-5.4 review, infringed provision confirmed", source: a1_label_review, key: [infringed_provision.correct, infringed_provision.n], fmt: "{0} of {1}"}
    - {id: a1.review.controls, text: "Planted label errors caught (legal basis + infringed provision)", source: a1_label_review, key: [controls.base.caught, controls.infringed.caught, controls.base.planted, controls.infringed.planted], fmt: "{0} of {2} (legal basis), {1} of {3} (infringed provision)"}
    - {id: a1.kappa.gemini_mistral, text: "Category: Gemini vs Mistral on the corpus, agreement and Cohen's kappa", source: a1_label_review, key: ["category.gemini vs mistral (corpus).n", "category.gemini vs mistral (corpus).agreement", "category.gemini vs mistral (corpus).kappa"], fmt: "{1:%1}, kappa {2:.2f} (n = {0:,.0f})"}
    - {id: a1.kappa.reviewer_gemini, text: "Category: GPT-5.4 vs Gemini, agreement and kappa (100 decisions)", source: a1_label_review, key: ["category.reviewer vs gemini.agreement", "category.reviewer vs gemini.kappa"], fmt: "{0:%0}, kappa {1:.2f}"}

# ------------------------------------------------------------------------------------------------ A1 retrieval
- id: a1
  title: A1 — version 2 retrieves similar decisions better than version 1
  claim: >-
    On the 1,503 decisions both versions hold, version 2's retrieval vector (full report and its compression, embedded and
    summed) ranks decisions with the same legal basis higher than version 1's, and it is the best of nine methods under
    every relevance definition.
  caveats:
    - Silver labels and binary relevance; document-to-document retrieval only.
    - The vector was chosen on half of the queries (Phase 4.1); the held-out half gives the same margin (DECISIONS 2026-10-10 — the table reports all queries, the held-out half as a check).
    - The compression is not deterministic; the fused vector keeps 7.9 of a decision's 10 neighbours when the compression is rerun.
  numbers:
    - {id: a1.queries, text: "Queries with R-base on the comparison set", source: a1_main, where: {scope: comparison_set, relevance: R-base, method: M4, metric: nDCG@10}, value: queries, fmt: "{0:d}"}
    - {id: a1.v2.ndcg, text: "Version 2, nDCG@10, R-base, comparison set (95% CI)", source: a1_main, where: {scope: comparison_set, relevance: R-base, method: M4, metric: nDCG@10}, value: [mean, ci_low, ci_high], fmt: "{0:.3f} ({1:.3f} to {2:.3f})"}
    - {id: a1.v1.ndcg, text: "Version 1, nDCG@10, R-base, comparison set (95% CI)", source: a1_main, where: {scope: comparison_set, relevance: R-base, method: M3, metric: nDCG@10}, value: [mean, ci_low, ci_high], fmt: "{0:.3f} ({1:.3f} to {2:.3f})"}
    - {id: a1.diff.ndcg, text: "Version 2 − version 1, nDCG@10, R-base, comparison set (Holm p)", source: a1_contrasts, where: {scope: comparison_set, relevance: R-base, contrast: M4 - M3, metric: nDCG@10}, value: [diff, ci_low, ci_high, p_holm], fmt: "{0:+.3f} ({1:.3f} to {2:.3f}), p {3:p}"}
    - {id: a1.diff.r5, text: "Version 2 − version 1, Recall@5, R-base, comparison set (Holm p)", source: a1_contrasts, where: {scope: comparison_set, relevance: R-base, contrast: M4 - M3, metric: R@5}, value: [diff, ci_low, ci_high, p_holm], fmt: "{0:+.3f} ({1:.3f} to {2:.3f}), p = {3:p}"}
    - {id: a1.diff.mar, text: "Version 2 − version 1, mAR, R-base, comparison set (Holm p)", source: a1_contrasts, where: {scope: comparison_set, relevance: R-base, contrast: M4 - M3, metric: mAR}, value: [diff, ci_low, ci_high, p_holm], fmt: "{0:+.3f} ({1:.3f} to {2:.3f}), p {3:p}"}
