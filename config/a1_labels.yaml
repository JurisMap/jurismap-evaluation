# A1 retrieval benchmark: silver labels (implementation plan, Phase 4a).
# status: approved. The author confirmed the choices marked "confirm" on 2026-10-07 (DECISIONS.md).
version: 1
status: approved

# The labels were built on the v2.2 corpus (corpus_v2_rebuilt_20260927.parquet). The v2.3 rebuild has the
# same decisions and texts; it adds the fused vectors, their two parts and the new map coordinates.
corpus: data/v2/corpus_v2_rebuilt_20261009.parquet   # v2.3 frozen corpus, 2,390 decisions
comparison_set: data/v2/shared_ids.txt               # 1,503 decisions also in v1

# Provisions cited in almost any case, which say nothing about the conduct. They are parsed and
# stored, but left out of the keys that decide relevance. (confirm)
#   DL 73/1966 art. 88: insurers must obey the regulator's rules (cited in 44% of the decisions)
#   DL 73/1966 art. 36: SUSEP's powers
generic_provisions:
  - DL73/1966:art88
  - DL73/1966:art36

# Sanction regulations: their articles set the penalty. Some legal-basis fields include them and
# most do not, so they are left out of the relevance keys too. (confirm)
sanction_norms:
  - RES-CNSP243/2011
  - RES-CNSP393/2020
  - RES-CNSP60/2001

relevance:
  jaccard_threshold: 0.5      # relaxed R-base and R-prov

# Development sample: the only decisions whose report and vote were read while the patterns for
# the infringed provision (jm_eval/retrieval/labels.py) were tuned. Drawn from the corpus sorted by
# acordao_hash with numpy.random.default_rng(seed).choice(n_corpus, n, replace=False).
# The citation parser (jm_eval/retrieval/provisions.py) was written on these decisions too. Its
# misses on the legal-basis field of the whole corpus were then inspected (that field is the label
# source, not text that any retrieval method reads), and so was a first audit draw (see `audit`).
